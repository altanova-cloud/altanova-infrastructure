# =============================================================================
# GitLab CI/CD Pipeline for Terraform Infrastructure
# =============================================================================
#
# Folder-based structure (no workspaces):
#   aws/shared-euw1/vpc    → State: shared-euw1-vpc
#   aws/dev-euw1/eks       → State: dev-euw1-eks
#   aws/prod-euw1/iam      → State: prod-euw1-iam
#
# To add a new region:
#   1. Copy folder (e.g., cp -r aws/dev-euw1 aws/dev-eus2)
#   2. Update region in main.tf
#   3. Add CI jobs below
# =============================================================================

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.8"
  GITLAB_TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state"

# =============================================================================
# Base Template
# =============================================================================
.terraform:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      # Configure GitLab HTTP backend
      export TF_HTTP_ADDRESS="${GITLAB_TF_ADDRESS}/${TF_STATE_NAME}"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_USERNAME="gitlab-ci-token"
      export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
      export TF_HTTP_LOCK_METHOD="POST"
      export TF_HTTP_UNLOCK_METHOD="DELETE"

      # Install AWS CLI
      apk add --no-cache aws-cli > /dev/null 2>&1

      # Assume AWS role using OIDC
      CREDENTIALS=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
    - cd ${TF_DIR}
    - terraform init
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

# =============================================================================
# SHARED-EUW1 (Shared Account - eu-west-1)
# =============================================================================
.shared-euw1:
  extends: .terraform
  variables:
    AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"

# VPC
"shared-euw1/vpc/validate":
  extends: .shared-euw1
  stage: validate
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script: [terraform validate]

"shared-euw1/vpc/plan":
  extends: .shared-euw1
  stage: plan
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script: [terraform plan -out=tfplan]
  artifacts:
    paths: [aws/shared-euw1/vpc/tfplan]
    expire_in: 7 days

"shared-euw1/vpc/apply":
  extends: .shared-euw1
  stage: apply
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script: [terraform apply -auto-approve tfplan]
  dependencies: ["shared-euw1/vpc/plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

# Route53
"shared-euw1/route53/validate":
  extends: .shared-euw1
  stage: validate
  variables:
    TF_DIR: aws/shared-euw1/route53
    TF_STATE_NAME: shared-euw1-route53
  script: [terraform validate]

"shared-euw1/route53/plan":
  extends: .shared-euw1
  stage: plan
  variables:
    TF_DIR: aws/shared-euw1/route53
    TF_STATE_NAME: shared-euw1-route53
