  artifacts:
    paths: [aws/shared-euw1/route53/tfplan]
    expire_in: 7 days

"shared-euw1/route53/apply":
  extends: .shared-euw1
  stage: apply
  variables:
    TF_DIR: aws/shared-euw1/route53
    TF_STATE_NAME: shared-euw1-route53
  script: [terraform apply -auto-approve tfplan]
  dependencies: ["shared-euw1/route53/plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

# ECR
"shared-euw1/ecr/validate":
  extends: .shared-euw1
  stage: validate
  variables:
    TF_DIR: aws/shared-euw1/ecr
    TF_STATE_NAME: shared-euw1-ecr
