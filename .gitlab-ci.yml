# =============================================================================
# GitLab CI/CD Pipeline for Terraform Infrastructure
# =============================================================================
#
# Architecture:
#   - GitLab-managed HTTP backend for Terraform state
#   - OIDC authentication with AWS (no static credentials)
#   - Workspaces for environment + region separation
#
# Workspace Naming: {env}-{region_code}
#   - shared-euw1 (Shared in eu-west-1)
#   - dev-euw1    (Dev in eu-west-1)
#   - prod-euw1   (Prod in eu-west-1)
#   - dev-eus2    (Dev in eu-south-2 Spain)
#   - dev-use1    (Dev in us-east-1)
#
# Region Codes:
#   - euw1 = eu-west-1 (Ireland)
#   - eus2 = eu-south-2 (Spain)
#   - use1 = us-east-1 (N. Virginia)
# =============================================================================

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.8"
  GITLAB_TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state"

# =============================================================================
# Base Template for Workspace-based Terraform Jobs
# =============================================================================
.terraform_workspace:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      # Configure GitLab HTTP backend
      export TF_HTTP_ADDRESS="${GITLAB_TF_ADDRESS}/${TF_STATE_NAME}"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_USERNAME="gitlab-ci-token"
      export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
      export TF_HTTP_LOCK_METHOD="POST"
      export TF_HTTP_UNLOCK_METHOD="DELETE"

      echo "State: ${TF_STATE_NAME}"
      echo "Workspace: ${TF_WORKSPACE}"

      # Install AWS CLI
      if ! command -v aws &> /dev/null; then
        apk add --no-cache aws-cli
      fi

      # Verify OIDC token
      if [ -z "$GITLAB_OIDC_TOKEN" ]; then
        echo "ERROR: GITLAB_OIDC_TOKEN is empty!"
        exit 1
      fi

      # Assume AWS role using OIDC
      CREDENTIALS=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
      echo "AWS credentials obtained via OIDC"
    - cd ${TF_WORKING_DIR}
    - terraform init
    - terraform workspace select ${TF_WORKSPACE} || terraform workspace new ${TF_WORKSPACE}
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# =============================================================================
# SHARED ACCOUNT - VPC (Workspace: shared-euw1)
# =============================================================================
validate:vpc:shared-euw1:
  extends: .terraform_workspace
  stage: validate
  variables:
    TF_WORKING_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
    AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"
  script:
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - aws/shared/vpc/**/*
        - aws/modules/vpc/**/*

plan:vpc:shared-euw1:
  extends: .terraform_workspace
  stage: plan
  variables:
    TF_WORKING_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
    AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - aws/shared/vpc/tfplan
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - aws/shared/vpc/**/*
        - aws/modules/vpc/**/*

apply:vpc:shared-euw1:
  extends: .terraform_workspace
  stage: apply
  variables:
    TF_WORKING_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
    AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan:vpc:shared-euw1
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - aws/shared/vpc/**/*
        - aws/modules/vpc/**/*
      when: manual

