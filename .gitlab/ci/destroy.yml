# =============================================================================
# Destroy Pipeline (Only runs when DESTROY variable is set)
# =============================================================================
# Run manually with: CI/CD > Run Pipeline > Add variable: DESTROY = true
# =============================================================================

include:
  - local: ".gitlab/ci/templates.yml"

stages:
  - destroy

# -----------------------------------------------------------------------------
# Dev EKS Destroy
# -----------------------------------------------------------------------------
dev:eks:destroy:
  extends: .terraform
  stage: destroy
  variables:
    TF_DIR: aws/dev-euw1/eks
    TF_STATE_NAME: dev-euw1-eks
    AWS_ROLE_ARN: "arn:aws:iam::975050047325:role/DevDeployRole"
  script:
    - echo "⚠️  DESTROYING dev-euw1 EKS cluster..."
    - terraform destroy -auto-approve
  when: manual

dev:iam:destroy:
  extends: .terraform
  stage: destroy
  variables:
    TF_DIR: aws/dev-euw1/iam
    TF_STATE_NAME: dev-euw1-iam
    AWS_ROLE_ARN: "arn:aws:iam::975050047325:role/DevDeployRole"
  script:
    - echo "⚠️  DESTROYING dev-euw1 IAM..."
    - terraform destroy -auto-approve
  when: manual

