# =============================================================================
# GitLab CI/CD Pipeline for Terraform Infrastructure
# =============================================================================
#
# Uses parallel:matrix for scalability and grouped job names for clean UI.
#
# Job naming: {workspace}/{component}/{action}
#   - shared-euw1/vpc/plan
#   - dev-euw1/eks/apply
#
# To add a new region, just add to the matrix arrays below.
# =============================================================================

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_VERSION: "1.8"
  GITLAB_TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state"

# =============================================================================
# Base Template
# =============================================================================
.terraform:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - |
      # Configure GitLab HTTP backend
      export TF_HTTP_ADDRESS="${GITLAB_TF_ADDRESS}/${TF_STATE_NAME}"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_USERNAME="gitlab-ci-token"
      export TF_HTTP_PASSWORD="${CI_JOB_TOKEN}"
      export TF_HTTP_LOCK_METHOD="POST"
      export TF_HTTP_UNLOCK_METHOD="DELETE"

      # Install AWS CLI
      apk add --no-cache aws-cli > /dev/null 2>&1

      # Assume AWS role using OIDC
      CREDENTIALS=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}" \
        --web-identity-token "${GITLAB_OIDC_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
    - cd ${TF_DIR}
    - terraform init
    - terraform workspace select ${TF_WORKSPACE} || terraform workspace new ${TF_WORKSPACE}
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]

# =============================================================================
# SHARED ACCOUNT - VPC, Route53, ECR
# =============================================================================
.shared:
  extends: .terraform
  variables:
    AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"

"shared/vpc/validate":
  extends: .shared
  stage: validate
  variables:
    TF_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
  script:
    - terraform validate

"shared/vpc/plan":
  extends: .shared
  stage: plan
  variables:
    TF_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths: [aws/shared/vpc/tfplan]
    expire_in: 7 days

"shared/vpc/apply":
  extends: .shared
  stage: apply
  variables:
    TF_DIR: aws/shared/vpc
    TF_STATE_NAME: vpc
    TF_WORKSPACE: shared-euw1
  script:
    - terraform apply -auto-approve tfplan
  dependencies: ["shared/vpc/plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

"shared/route53/validate":
  extends: .shared
  stage: validate
  variables:
    TF_DIR: aws/shared/route53
    TF_STATE_NAME: route53
    TF_WORKSPACE: shared-euw1
  script:
    - terraform validate

"shared/route53/plan":
  extends: .shared
  stage: plan
  variables:
    TF_DIR: aws/shared/route53
    TF_STATE_NAME: route53
    TF_WORKSPACE: shared-euw1
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths: [aws/shared/route53/tfplan]
    expire_in: 7 days

"shared/route53/apply":
  extends: .shared
  stage: apply
  variables:
    TF_DIR: aws/shared/route53
    TF_STATE_NAME: route53
    TF_WORKSPACE: shared-euw1
  script:
    - terraform apply -auto-approve tfplan
  dependencies: ["shared/route53/plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

"shared/ecr/validate":
  extends: .shared
  stage: validate
  variables:
    TF_DIR: aws/shared/ecr
    TF_STATE_NAME: ecr
    TF_WORKSPACE: shared-euw1
  script:
    - terraform validate

"shared/ecr/plan":
  extends: .shared
  stage: plan
  variables:
    TF_DIR: aws/shared/ecr
    TF_STATE_NAME: ecr
    TF_WORKSPACE: shared-euw1
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths: [aws/shared/ecr/tfplan]
    expire_in: 7 days

"shared/ecr/apply":
  extends: .shared
  stage: apply
  variables:
    TF_DIR: aws/shared/ecr
    TF_STATE_NAME: ecr
    TF_WORKSPACE: shared-euw1
  script:
    - terraform apply -auto-approve tfplan
  dependencies: ["shared/ecr/plan"]
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

# =============================================================================
# DEV ACCOUNT - IAM & EKS (Matrix for future regions)
# =============================================================================
.dev:
  extends: .terraform
  variables:
    AWS_ROLE_ARN: "arn:aws:iam::975050047325:role/DevDeployRole"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"

"dev/iam/validate":
  extends: .dev
  stage: validate
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
        # Future: dev-eus2, dev-use1
  variables:
    TF_DIR: aws/iam
    TF_STATE_NAME: iam
  script:
    - terraform validate

"dev/iam/plan":
  extends: .dev
  stage: plan
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/iam
    TF_STATE_NAME: iam
  script:
    - terraform plan -out=tfplan-${TF_WORKSPACE}
  artifacts:
    paths: [aws/iam/tfplan-*]
    expire_in: 7 days

"dev/iam/apply":
  extends: .dev
  stage: apply
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/iam
    TF_STATE_NAME: iam
  script:
    - terraform apply -auto-approve tfplan-${TF_WORKSPACE}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

"dev/eks/validate":
  extends: .dev
  stage: validate
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/eks
    TF_STATE_NAME: eks
  script:
    - terraform validate

"dev/eks/plan":
  extends: .dev
  stage: plan
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/eks
    TF_STATE_NAME: eks
  script:
    - terraform plan -out=tfplan-${TF_WORKSPACE}
  artifacts:
    paths: [aws/eks/tfplan-*]
    expire_in: 7 days

"dev/eks/apply":
  extends: .dev
  stage: apply
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/eks
    TF_STATE_NAME: eks
  script:
    - terraform apply -auto-approve tfplan-${TF_WORKSPACE}
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

"dev/eks/destroy":
  extends: .dev
  stage: destroy
  parallel:
    matrix:
      - TF_WORKSPACE: [dev-euw1]
  variables:
    TF_DIR: aws/eks
    TF_STATE_NAME: eks
  script:
    - terraform destroy -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual

