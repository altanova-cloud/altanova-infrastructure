# =============================================================================
# Child Pipeline: shared-euw1 (Shared Account - eu-west-1)
# =============================================================================
# Resources: VPC, Route53, ECR
# =============================================================================

include:
  - local: ".gitlab/ci/templates.yml"

stages:
  - validate
  - plan
  - apply

variables:
  AWS_ROLE_ARN: "arn:aws:iam::265245191272:role/GitLabRunnerRole"

# -----------------------------------------------------------------------------
# VPC
# -----------------------------------------------------------------------------
vpc:validate:
  extends: .terraform
  stage: validate
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script:
    - terraform validate
    - terraform fmt -check

vpc:plan:
  extends: .terraform
  stage: plan
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths: [aws/shared-euw1/vpc/tfplan]
    expire_in: 7 days
  needs: [vpc:validate]

vpc:apply:
  extends: .terraform
  stage: apply
  variables:
    TF_DIR: aws/shared-euw1/vpc
    TF_STATE_NAME: shared-euw1-vpc
  script:
    - terraform apply -auto-approve tfplan
  needs: [vpc:plan]
  when: manual

