# =============================================================================
# Environments Configuration
# =============================================================================
#
# Folder-based structure (no workspaces):
#   aws/{env}-{region}/resource → State: {env}-{region}-{resource}
#
# Directory Structure:
#   aws/shared-euw1/vpc, route53, ecr
#   aws/dev-euw1/iam, eks
#   aws/prod-euw1/iam, eks
#
# To add a new region (e.g., Spain):
#   1. cp -r aws/dev-euw1 aws/dev-eus2
#   2. Update region in each main.tf
#   3. Add CI jobs in .gitlab-ci.yml
#
# Region Codes:
#   - euw1 = eu-west-1 (Ireland)
#   - eus2 = eu-south-2 (Spain)
#   - use1 = us-east-1 (N. Virginia)
# =============================================================================

accounts:
  shared:
    account_id: "265245191272"
    role_arn: "arn:aws:iam::265245191272:role/GitLabRunnerRole"

  dev:
    account_id: "975050047325"
    role_arn: "arn:aws:iam::975050047325:role/DevDeployRole"

  prod:
    account_id: "624755517249"
    role_arn: "arn:aws:iam::624755517249:role/ProdDeployRole"

# -----------------------------------------------------------------------------
# Environments
# -----------------------------------------------------------------------------
environments:
  shared-euw1:
    region: eu-west-1
    account: shared
    resources:
      - vpc
      - route53
      - ecr

  dev-euw1:
    region: eu-west-1
    account: dev
    resources:
      - iam
      - eks

  prod-euw1:
    region: eu-west-1
    account: prod
    resources:
      - iam
      - eks

  # Future environments:
  # dev-eus2:
  #   region: eu-south-2
  #   account: dev
  #   resources: [iam, eks]
  #
  # dev-use1:
  #   region: us-east-1
  #   account: dev
  #   resources: [iam, eks]

# =============================================================================
# Deployment Order
# =============================================================================
#
# Phase 1: Shared Account
#   1. shared-euw1/vpc     - Creates VPC, subnets, NAT, RAM shares
#   2. shared-euw1/route53 - Creates hosted zone
#   3. shared-euw1/ecr     - Creates container registries
#
# Phase 2: Dev Account
#   4. dev-euw1/iam        - Creates DevDeployRole
#   5. dev-euw1/eks        - Creates EKS cluster
#
# Phase 3: Prod Account
#   6. prod-euw1/iam       - Creates ProdDeployRole
#   7. prod-euw1/eks       - Creates EKS cluster
#
# =============================================================================
