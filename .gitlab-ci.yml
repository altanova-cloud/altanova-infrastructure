# =============================================================================
# Parent Pipeline - Triggers Child Pipelines per Environment
# =============================================================================
#
# Normal push to master:
#   → shared-euw1 pipeline (VPC, Route53, ECR)
#   → dev-euw1 pipeline (IAM, EKS)
#   → prod-euw1 pipeline (IAM, EKS) - manual trigger
#
# To destroy resources:
#   CI/CD > Run Pipeline > Add variable: DESTROY = true
#
# =============================================================================

stages:
  - shared
  - dev
  - prod
  - destroy

# =============================================================================
# DEPLOY PIPELINES (Default workflow)
# =============================================================================
workflow:
  rules:
    - if: $DESTROY == "true"
      when: never
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Shared Account (eu-west-1)
shared-euw1:
  stage: shared
  trigger:
    include: .gitlab/ci/shared-euw1.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - aws/shared-euw1/**/*
        - aws/modules/vpc/**/*
        - .gitlab/ci/shared-euw1.yml
        - .gitlab/ci/templates.yml
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# Dev Account (eu-west-1)
dev-euw1:
  stage: dev
  trigger:
    include: .gitlab/ci/dev-euw1.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - aws/dev-euw1/**/*
        - aws/modules/eks-cluster/**/*
        - aws/modules/deployment-role/**/*
        - .gitlab/ci/dev-euw1.yml
        - .gitlab/ci/templates.yml
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# Prod Account (eu-west-1) - Always manual
prod-euw1:
  stage: prod
  trigger:
    include: .gitlab/ci/prod-euw1.yml
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# =============================================================================
# DESTROY PIPELINE (Only when DESTROY=true)
# =============================================================================
destroy:
  stage: destroy
  trigger:
    include: .gitlab/ci/destroy.yml
    strategy: depend
  rules:
    - if: $DESTROY == "true" && $CI_COMMIT_BRANCH == "master"
      when: manual
