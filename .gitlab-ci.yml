# GitLab CI/CD Pipeline for Terraform Infrastructure
# Uses OIDC authentication (no static credentials)
# Simplified for quick deployment - no security tools, no approval gates
#
# Test trigger: Pipeline should start automatically on push/merge request
#
# Prerequisites:
# 1. GitLab OIDC Provider configured in AWS
# 2. IAM roles created and trusting OIDC provider
# 3. GitLab CI/CD variables configured:
#    - AWS_ROLE_ARN: arn:aws:iam::265245191272:role/GitLabRunnerRole
#    - DEV_DEPLOY_ROLE_ARN: arn:aws:iam::975050047325:role/DevDeployRole
#    - PROD_DEPLOY_ROLE_ARN: arn:aws:iam::624755517249:role/ProdDeployRole

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  AWS_REGION: "us-east-1"
  TF_VERSION: "1.8"

# Cache for Terraform
.terraform_cache:
  cache:
    key:
      files:
        - aws/environments/*/backend.conf
    paths:
      - .terraform/
      - .terraform.d/

# OIDC Authentication script (reusable)
.assume_role_script: &assume_role_script
  - |
    # Get GitLab OIDC token
    GITLAB_TOKEN=${CI_JOB_JWT}
    echo "Using OIDC token from GitLab"

    # Install aws-cli if not present
    if ! command -v aws &> /dev/null; then
      apk add --no-cache aws-cli
    fi

    # Assume AWS role using OIDC token
    CREDENTIALS=$(aws sts assume-role-with-web-identity \
      --role-arn ${AWS_ROLE_ARN} \
      --role-session-name "gitlab-ci-${CI_JOB_ID}-${CI_COMMIT_SHORT_SHA}" \
      --web-identity-token ${GITLAB_TOKEN} \
      --duration-seconds 3600 \
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
      --output text)

    # Export AWS credentials
    export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
    export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
    export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
    echo "✅ AWS credentials obtained via OIDC"

# Base template for Terraform jobs
.terraform_base:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  extends: .terraform_cache
  before_script:
    - |
      # Debug: Check available variables
      echo "DEBUG: CI_JOB_JWT = ${CI_JOB_JWT}"
      echo "DEBUG: CI_JOB_JWT_V2 = ${CI_JOB_JWT_V2}"

      # Install aws-cli if not present
      if ! command -v aws &> /dev/null; then
        echo "Installing aws-cli..."
        apk add --no-cache aws-cli
      fi

      # Try to get OIDC token
      GITLAB_TOKEN=${CI_JOB_JWT}

      if [ -z "$GITLAB_TOKEN" ]; then
        echo "ERROR: CI_JOB_JWT is empty!"
        echo "Available JWT variables:"
        env | grep -i jwt || echo "No JWT variables found"
        exit 1
      fi

      echo "Using OIDC token from GitLab"

      # Assume AWS role using OIDC token
      CREDENTIALS=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-ci-${CI_JOB_ID}-${CI_COMMIT_SHORT_SHA}" \
        --web-identity-token "${GITLAB_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)

      export AWS_ACCESS_KEY_ID=$(echo $CREDENTIALS | awk '{print $1}')
      export AWS_SECRET_ACCESS_KEY=$(echo $CREDENTIALS | awk '{print $2}')
      export AWS_SESSION_TOKEN=$(echo $CREDENTIALS | awk '{print $3}')
      echo "✅ AWS credentials obtained via OIDC"
    - cd ${TF_WORKING_DIR}
    - terraform init -backend-config=backend.conf
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ============================================================================
# SHARED ACCOUNT (State & OIDC)
# ============================================================================

validate:shared:
  extends: .terraform_base
  stage: validate
  variables:
    TF_WORKING_DIR: aws/environments/shared-account
    AWS_ROLE_ARN: $AWS_ROLE_ARN
  script:
    - terraform fmt -check -recursive
    - terraform validate
  only:
    - master
    - merge_requests

plan:shared:
  extends: .terraform_base
  stage: plan
  variables:
    TF_WORKING_DIR: aws/environments/shared-account
    AWS_ROLE_ARN: $AWS_ROLE_ARN
  script:
    - terraform plan -no-color -out=tfplan | tee plan_output.txt
  artifacts:
    paths:
      - aws/environments/shared-account/tfplan
      - aws/environments/shared-account/plan_output.txt
    expire_in: 7 days
  dependencies:
    - validate:shared
  only:
    - master
    - merge_requests

apply:shared:
  extends: .terraform_base
  stage: apply
  variables:
    TF_WORKING_DIR: aws/environments/shared-account
    AWS_ROLE_ARN: $AWS_ROLE_ARN
  script:
    - terraform apply -auto-approve -no-color tfplan
  dependencies:
    - plan:shared
  only:
    - master
  when: on_success

