    TF_WORKING_DIR: aws/environments/dev-app-account
    AWS_ROLE_ARN: $DEV_DEPLOY_ROLE_ARN
  script:
    - echo "🔴 DESTROYING Dev Account Infrastructure"
    - terraform plan -destroy -no-color -out=destroy.tfplan | tee destroy_plan.txt
    - terraform apply -auto-approve -no-color destroy.tfplan
  artifacts:
    paths:
      - aws/environments/dev-app-account/destroy_plan.txt
    expire_in: 90 days
  only:
